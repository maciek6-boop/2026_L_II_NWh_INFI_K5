version: 2.1

jobs:
  build-and-test:  
    machine: 
      image: ubuntu-2004:current 
        
    steps: 
      - checkout 
      - run: 
          name: Install dependencies
          command: make deps 
      - run: 
          name: Run Linter
          command: make lint
      - run: 
          name: Run Tests
          command: make test       
      - run:
          name: Build Docker Image
          command: make docker_build

workflows: 
  basic:  
    jobs: 
      - build-and-test
